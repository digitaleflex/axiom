# Canonical example of an Axiom project manifest (axiom.yaml), version 1.
# Schema: schemas/axiom.schema.json — Spec: docs/architecture/axiom-yaml.md
# The manifest is OPTIONAL: repositories deploy through auto-detection without it.
version: 1
app:
  name: acme-web
strategy: nextjs
runtime:
  language: typescript
  version: "20"
  packageManager: pnpm
build:
  command: pnpm build
start:
  command: pnpm start
port: 3000
env:
  - name: DATABASE_URL
    required: true
    secret: true
  - name: PUBLIC_SITE_NAME
    required: false
    secret: false
domains:
  - app.acme.dev
health:
  type: http
  path: /api/health
  expectedStatus: 200
  timeoutSeconds: 5
  retries: 5
constraints:
  architecture: linux/amd64
  minMemoryMB: 512
